# Registration of this extension's own form element types.
#
# The EditFeUserController creates element types that EXT:form does not know:
# ImageCrop, DateTimePicker, LabeledStaticText, LabeledFluid, Fluid, Html and
# PasswordGenerator.
# The corresponding Fluid partials have always been located under
# Resources/Private/Form-Frontend/Partials/ — what was missing was this registration.
#
# Without it, "skipUnknownElements: true" applies in the standard prototype: the elements
# are silently replaced by an empty UnknownFormElement and render nothing — without any
# error message. This was visible as a missing image preview including cropping, a missing
# date picker and missing separator lines.
#
# The file is included via plugin.tx_form.settings.yamlConfigurations
# in Configuration/Typoscript/setup.typoscript.

prototypes:
  standard:
    formElementsDefinition:

      # Base rendering: own partial directory in addition to the one from EXT:form
      Form:
        renderingOptions:
          partialRootPaths:
            100: 'EXT:jw_feuser_manager/Resources/Private/Form-Frontend/Partials/'

      # Image preview with cropping (cropper.js). Expects the properties
      # imageUid, ceUid and colUid, which the controller sets.
      ImageCrop:
        implementationClassName: TYPO3\CMS\Form\Domain\Model\FormElements\GenericFormElement
        renderingOptions:
          templateName: ImageCrop
        properties:
          imageUid: ''
          ceUid: ''
          colUid: ''
          containerClassAttribute: 'input imagecrop'

      # Date field
      DateTimePicker:
        implementationClassName: TYPO3\CMS\Form\Domain\Model\FormElements\GenericFormElement
        renderingOptions:
          templateName: DateTimePicker
        properties:
          containerClassAttribute: input

      # Static text with label
      LabeledStaticText:
        implementationClassName: TYPO3\CMS\Form\Domain\Model\FormElements\GenericFormElement
        renderingOptions:
          templateName: LabeledStaticText
        properties:
          text: ''
          containerClassAttribute: input

      # Free Fluid with label
      LabeledFluid:
        implementationClassName: TYPO3\CMS\Form\Domain\Model\FormElements\GenericFormElement
        renderingOptions:
          templateName: LabeledFluid
        properties:
          content: ''
          containerClassAttribute: input

      # Free Fluid without label
      Fluid:
        implementationClassName: TYPO3\CMS\Form\Domain\Model\FormElements\GenericFormElement
        renderingOptions:
          templateName: Fluid
        properties:
          content: ''

      # "Generate random password" button. A dedicated type instead of an HTML snippet in
      # the content property: Fluid would interpret the curly braces of the JavaScript
      # as expressions. The logic is located in
      # Resources/Public/JavaScript/passwordGenerator.js.
      PasswordGenerator:
        implementationClassName: TYPO3\CMS\Form\Domain\Model\FormElements\GenericFormElement
        renderingOptions:
          templateName: PasswordGenerator
        properties:
          fieldId: ''
          length: 12
          containerClassAttribute: input

      # Raw HTML block (separator lines)
      Html:
        implementationClassName: TYPO3\CMS\Form\Domain\Model\FormElements\GenericFormElement
        renderingOptions:
          templateName: Html
        properties:
          content: ''
